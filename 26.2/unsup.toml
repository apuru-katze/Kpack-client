# declare group 
[flavor_groups.kucay]
name = "MuaraSMP KucayPack"
description = "from the ashes became a muara"
side = "both"
[[flavor_groups.kucay.choices]]
id = "kucay_base"
name = "Base Version"
description = "Versi basic cuman mod yang penting aja, cocok buat yang mau main di server SMP"
[[flavor_groups.kucay.choices]]
id = "kucay_fancy"
name = "Fancy Version"
description = "Versi fancy dengan lebih banyak fitur dan visual yang menarik"

[flavor_groups.shader]
name = "Shader Choices"
description = "Only Shader dan optimasinya"
side = "client"
[[flavor_groups.shader.choices]]
id = "noshader"
name = "NO Shader"
description = "Tanpa Shader"
[[flavor_groups.shader.choices]]
id = "shader"
name = "Iris Shader"
description = "Shader dan optimasinya"
# =---------------------------------------=
[flavor_groups.clienttweak]
name = "Tweak Client"
side = "client"
description = "Tambahin HUD, Inventory sort, Zoom, Resourcepack Management, dan Map"
choices = ["clienttweak_off", "clienttweak_on"]

[flavor_groups.flashback]
name = "Flashback"
side = "client"
description = "Flashback record, sudah support record in-game voice"
choices = ["flashback_off", "flashback_on"]

[flavor_groups.vivecraft]
name = "Vivecraft"
side = "client"
description = "VR client support"
choices = ["vivecraft_off", "vivecraft_on"]

[flavor_groups.voxy]
name = "Voxy"
side = "client"
description = "Nambahkan Render Distance dari server"
choices = ["voxy_off", "voxy_on"]

[flavor_groups.experimental]
name = "Experimental Optimise"
side = "client"
description = "Experimental optimise"
choices = ["experimental_off", "experimental_on"]

[flavor_groups.tweakeroo]
name = "Tweakeroo"
side = "client"
description = "All in one tool, Gamma view, zoom, flex placement block."
choices = ["tweakeroo_off", "tweakeroo_on"]

